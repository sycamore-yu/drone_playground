[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-playground"
version = "0.1.0"
description = "Crazyflow quadrotor simulation, learning and reproducible experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crazyflow", "jax", "flax", "optax", "hydra-core", "numpy", "scipy",
  "mujoco", "mujoco-mjx", "rscope", "grpcio", "protobuf", "PyYAML",
]

[project.scripts]
drone-playground = "drone_playground.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_playground"]

[tool.hatch.build.targets.wheel.force-include]
"assets/scenes" = "drone_playground/assets/scenes"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"

[tool.pixi.pypi-dependencies]
drone-playground = { path = ".", editable = true }
crazyflow = { git = "https://github.com/learnsyslab/crazyflow.git", rev = "62a3146a408c5fd5d0c2451de22e29bd74a71b18" }
jax = { version = "==0.11.2", extras = ["cuda12"] }
nvidia-cudnn-cu12 = "==9.26.0.51"
rscope = "==0.0.8"
pytest = "*"
ruff = "*"
build = "*"
grpcio-tools = "*"

[tool.pixi.activation.env]
XLA_PYTHON_CLIENT_PREALLOCATE = "false"
MUJOCO_GL = "egl"
PYTHONPATH = ""
JAX_COMPILATION_CACHE_DIR = ".cache/jax"

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check src tests tools"
sim = "drone-playground mode=sim"
train = "drone-playground mode=train"
checkpoint_eval = "drone-playground mode=checkpoint_eval"
benchmark = "drone-playground mode=benchmark"
replay = "drone-playground mode=replay"
build = "python -m build"
acceptance = "drone-playground -m mode=train experiment=tracking,racing,navigation_depth,navigation_lidar learning=ppo,apg,shac seed=0,1,2"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
