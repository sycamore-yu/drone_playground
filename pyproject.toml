[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-playground"
version = "0.3.0"
description = "Composable JAX drone learning, planning, control and task evaluation"
license = {file = "LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
    "crazyflow==0.3.2",
    "brax==0.14.2",
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jaxlib==0.9.2",
    "flax==0.12.6",
    "optax==0.2.8",
    "mujoco==3.14.0",
    "mujoco-mjx==3.14.0",
    "mujoco-lidar==0.3.5",
    "rscope==0.0.8",
    "tensorboard>=2.18,<3",
    "tensorboardX==2.6.5",
    "numpy>=2.0",
    "scipy>=1.17",
    "ml_collections>=1.0",
    "hydra-core==1.3.7",
    "jax-dataclasses==1.6.2",
    "chex==0.1.90",
    "lotf==0.1.0",
    "matplotlib>=3.10,<4",
    "seaborn==0.13.2",
    "tqdm>=4.67,<5",
]

[project.scripts]
drone-playground = "drone_playground.cli:main"
drone-experiment = "drone_playground.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drone_playground.environments.tasks.lsy_upstream" = ["assets/*", "level0.toml", "LICENSE", "*.json", "*.patch"]
"drone_playground.methods.optimal_control.lsy_upstream" = ["LICENSE", "*.json", "*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "src/drone_playground/environments/tasks/lsy_upstream",
    "src/drone_playground/methods/optimal_control/lsy_upstream",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"
pip = "*"
pytest = ">=8.4"
ruff = "*"

[tool.pixi.pypi-dependencies]
drone-playground = { path = ".", editable = true }
crazyflow = { path = "tmp/sources/crazyflow", editable = true }
lotf = { path = "tmp/sources/lotf", editable = true }

[tool.pixi.activation.env]
SCIPY_ARRAY_API = "1"
XLA_PYTHON_CLIENT_PREALLOCATE = "false"
OMP_NUM_THREADS = "4"

[tool.pixi.tasks]
test = "env PYTHONPATH=src PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest"
train = "python scripts/train.py"
eval = "python scripts/eval.py"
play = "python scripts/play.py"
experiment = "python -m drone_playground.app"
demo = "python -m drone_playground.cli demo"
replay = "python -m drone_playground.cli replay"
metrics = "python -m drone_playground.cli metrics"
status = "python -m drone_playground.cli status"
