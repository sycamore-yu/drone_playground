[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-playground"
version = "0.2.0.dev0"
description = "Crazyflow quadrotor simulation, learning and reproducible experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crazyflow", "jax", "flax", "optax", "hydra-core", "numpy", "scipy",
  "mujoco", "mujoco-mjx", "mujoco-lidar==0.3.5", "rscope", "grpcio", "protobuf", "PyYAML",
  "Pillow>=10,<13",
  "orbax-checkpoint>=0.12,<0.13", "tensorboardX>=2.6.4,<3",
]

[project.optional-dependencies]
brax = ["brax==0.14.2"]

[project.scripts]
drone-playground = "drone_playground.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_playground"]

[tool.hatch.build.targets.wheel.force-include]
"assets/scenes" = "drone_playground/assets/scenes"
"LICENSES" = "drone_playground/licenses"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"

[tool.pixi.pypi-dependencies]
drone-playground = { path = ".", editable = true }
crazyflow = { git = "https://github.com/learnsyslab/crazyflow.git", rev = "62a3146a408c5fd5d0c2451de22e29bd74a71b18" }
jax = { version = "==0.11.2", extras = ["cuda12"] }
nvidia-cudnn-cu12 = "==9.26.0.51"
rscope = "==0.0.8"
orbax-checkpoint = "==0.12.7"
tensorboardx = "==2.6.4"
pytest = "*"
ruff = "*"
build = "*"
grpcio-tools = "*"

[tool.pixi.activation.env]
SCIPY_ARRAY_API = "1"
XLA_PYTHON_CLIENT_PREALLOCATE = "false"
MUJOCO_GL = "egl"
PYTHONPATH = ""
JAX_COMPILATION_CACHE_DIR = ".cache/jax"

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check src tests tools && ruff format --check src tests tools"
frame-contracts = "JAX_PLATFORMS=cpu pytest -q tests/test_yaw_frame_contract.py tests/test_sensor_age_observation.py tests/test_reference_frame_contract.py tests/test_oa_body_frame.py tests/test_oa_frame_latency_defaults.py tests/test_navigation_world_rotation.py tests/test_control_models.py"
setup-acados = "python tools/setup_acados.py"
autoresearch = "python tools/autoresearch.py"
play = "drone-playground mode=play"
train = "python tools/autoresearch.py train"
benchmark = "drone-playground mode=benchmark"
replay = "drone-playground mode=replay"
build = "python -m build"
viewer-build = "npm ci --prefix docs/viewer --no-audit --no-fund && npm run build --prefix docs/viewer"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
