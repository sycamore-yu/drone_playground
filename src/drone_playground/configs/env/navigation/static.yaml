# @package _global_
defaults:
- /sensor@env.sensor: mid360
- /controller@env.controller: attitude
- /dynamics@env.dynamics: crazyflow_first_principles
- _self_
env:
  scene:
    _target_: drone_playground.environments.scenes.catalog.CatalogNavigationScene
    name: navigation
    families:
    - navigation8
    dynamic: false
    scene_ids:
    - S01
    - S02
    - S03
    - S06
  task:
    name: navigation
    duration: 300.0
    goal_radius: 0.5
    reference_count: 32
    time_limit_kind: termination
    command_distribution:
      kind: position
      distribution: catalog
    observation:
      _target_: drone_playground.environments.observations.state.NavigationSensorObservation
      name: navigation_lidar
      include_goal: true
      include_previous_action: true
      action_size: 4
      history: 4
      points_per_frame: 120
      channels: 5
      near_m: 0.1
      far_m: 40.0
    reward:
      _target_: drone_playground.environments.tasks.rewards.NavigationObjective
      name: navigation
      progress_scale: 5.0
      time_cost: 0.01
      clearance_scale: 0.1
      clearance_radius: 0.5
      smoothness_scale: 0.01
      arrival_bonus: 20.0
      failure_penalty: -150.0
    _target_: drone_playground.environments.tasks.navigation.task.NavigationTask
    body_radius: 0.07
  name: navigation/static
  _target_: drone_playground.environments.base.DroneEnvironment
  reference: null
  freq: 50
  physics_freq: 500
evaluation:
  entrypoint: drone_playground.evaluation.navigation.policy.evaluate_navigation
  policy_evaluator: drone_playground.evaluation.navigation.policy.NavigationEvaluator
