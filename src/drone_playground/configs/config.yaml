defaults:
  - task: tracking
  - scene: empty
  - sensor: state
  - controller: mellinger
  - method: controller
  - learning: apg
  - benchmark: default
  - _self_
  - optional experiment: null
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

mode: sim
seed: 0
output: results/${now:%Y%m%d_%H%M%S}_${mode}_${task.name}_${sensor.name}_${learning.algorithm}_s${seed}
simulation:
  navigation_goal_observation: false
  device: gpu
  dynamics: first_principles
  drone: cf21B_500
  physics_hz: 500
  method_hz: 50
  num_envs: 1
  action_delay_s: 0.0
  randomization: {}
  disturbance: {}
observation:
  depth: {}
checkpoint: null
initial_checkpoint: null
resume: null
results:
  format: orbax
  keep_checkpoints: 3
replay_path: null
hydra:
  output_subdir: null
  run:
    dir: ${output}
  job:
    chdir: false
