defaults:
  - task: tracking
  - scene: empty
  - sensor: state
  - controller: mellinger
  - method: controller
  - learning: bptt
  - benchmark: default
  - _self_
  - randomization: nominal
  - optional experiment: null
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

mode: play
seed: 0
output: results/${now:%Y%m%d_%H%M%S}_${mode}_${task.name}_${sensor.name}_${learning.algorithm}_s${seed}
simulation:
  navigation_goal_observation: false
  device: gpu
  dynamics: first_principles
  drone: cf21B_500
  physics_hz: 500
  method_hz: 50
  num_envs: 1
  action_delay_s: 0.0
  randomization: {}
  disturbance: {}
observation:
  depth: {}
  lidar:
    point_count: 1024
checkpoint: null
checkpoint_root: results
initial_checkpoint: null
resume: null
learning:
  max_iterations: 1000
  best:
    source: null
    interval: 262144
    episodes: 8
    confirmation_episodes: 0
    metric: mean_reward
    seed: 1000000
  early_stopping:
    metric: mean_reward
    target: null
    patience: 0
    min_delta: 0.0
results:
  keep_checkpoints: 3
replay_path: null
hydra:
  output_subdir: null
  run:
    dir: ${output}
  job:
    chdir: false
