# @package _global_
# Broader parameter uncertainty, actuator/sensor delay, and bounded gusts.
# Noise on individual depth pixels or LiDAR rays is not implemented by this preset.
simulation:
  randomization:
    mass: [0.85, 1.15]
    inertia: [0.80, 1.20]
    motor_strength: [0.80, 1.20]
    drag: [0.75, 1.25]
  disturbance:
    gust_std_n: [0.008, 0.008, 0.012]
    gust_period_s: 0.2
  action_delay_s: [0.025, 0.050]
sensor:
  config:
    latency: [0.02, 0.04]
