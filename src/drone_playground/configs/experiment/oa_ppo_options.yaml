# @package _global_
# Optimizer/action/return recipe from the recorded successful Depth PPO runs.
# Geometry comes from the current procedural task, not those historical maps.
task:
  options:
    reward_profile: goal_reaching
    finite_horizon: true
simulation:
  navigation_goal_observation: true
observation:
  navigation_relative_goal: true
  navigation_world_rotation: true
method:
  action:
    level: acceleration
    heading: target
learning:
  loss: null
  max_interactions: 8388608
  options:
    horizon: 512
    gamma: 1.0
    gae_lambda: 1.0
    lr: 0.0002
    critic_lr: 0.0005
    critic_epochs: 4
    critic_uses_privileged: true
    critic_uses_sensor: false
    clip_epsilon: 0.15
    initial_log_std: -2.5
    entropy_weight: 0.0
    minibatches: 4
    ppo_epochs: 4
    ppo_target_kl: 0.025
    ppo_value_clip: 10.0
    task_weight: 1.0
    perception_weight: 0.0
    perception_loss: null
    altitude_weight: 0.0
    height_boundary_weight: 0.0
    failure_cost: 0.0
    progress_reward_scale: 0.0
