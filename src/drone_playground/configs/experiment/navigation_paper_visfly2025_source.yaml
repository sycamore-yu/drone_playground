# @package _global_
# Source-derived reward, action range and parameter initialization (VisFly 6ff29bf).
# 25Hz/Crazyflow and >=80m courses are explicit transfer conditions, not the source garage.
defaults:
  - navigation_paper_visfly2025_ppo

simulation:
  method_hz: 25

task:
  options:
    reward_profile: visfly2025

observation:
  visfly_quaternion_order: wxyz

method:
  action:
    thrust_to_weight_bounds: [0.0, 3.0]
    body_rate_limit: 2.0
  actor:
    initialization: pytorch

learning:
  critic:
    _target_: drone_playground.simulation.networks.Critic
    kind: visfly_depth
    initialization: pytorch
  options:
    horizon: 256
    minibatches: 4
    ppo_target_kl: 0.0
    ppo_value_clip: 0.0
    initial_log_std: 0.0
    failure_cost: 0.0
    altitude_weight: 0.0
    perception_weight: 0.0
  evaluation_interval: 80
  checkpoint_interval: 40

screening:
  probe_between_full: true
  full_every: 3

early_stopping:
  min_updates: 400
  patience: 4
