# @package _global_
# Recipe and checkpoint selection from the recorded passing state-task run.
defaults:
- tracking
- override /learning: shac
initial_checkpoint: null
resume: null
simulation:
  navigation_goal_observation: false
  device: gpu
  dynamics: first_principles
  drone: cf21B_500
  physics_hz: 500
  method_hz: 50
  num_envs: 512
  action_delay_s: 0.0
  randomization: {}
  disturbance: {}
method:
  action:
    level: body_rate
    heading: fixed
learning:
  loss: null
  backward_model: lotf
  backward_options: {}
  options:
    horizon: 32
    lr: 0.0003
    critic_lr: 0.001
    gamma: 0.99
    gae_lambda: 0.95
    ppo_epochs: 4
    minibatches: 4
    critic_epochs: 4
    clip_epsilon: 0.2
    entropy_weight: 0.0
    max_grad_norm: 1.0
    target_alpha: 0.995
    temporal_gradient_alpha: 0.0
    initial_log_std: -1.5
    weight_decay: 0.0
    task_weight: 1.0
    perception_weight: 1.0
    velocity_aux_weight: 0.0
    perception_loss: {}
  max_iterations: 1000
  checkpoint_interval: 100
  log_interval: 10
  best:
    source: evaluation
    interval: 1638400
    episodes: 8
    seed: 1000000
  early_stopping:
    metric: mean_reward
    target: null
    patience: 5
    min_delta: 0.0
