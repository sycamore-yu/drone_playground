# @package _global_
# Preserve measured LiDAR-D recipe, with the required >=80m training starts.
defaults:
  - navigation_procedural_lidar_ppo_ablation_d

simulation:
  procedural:
    min_start_goal_distance_m: 80.0

learning:
  options:
    lr: 0.0001
    critic_lr: 0.0005
    perception_weight: 0.5
    critic_uses_privileged: false
    critic_uses_sensor: true
    initial_log_std: -2.5
    clip_epsilon: 0.15
    progress_reward_scale: 0.25
    height_boundary_weight: 1.0
