# @package _global_
# A separately versioned PPO diagnostic recipe; no historical seed is resumed.
defaults:
- navigation_procedural_depth
learning:
  options:
    critic_uses_privileged: true
    initial_log_std: -2.0
    lr: 0.0001
    critic_lr: 0.0003
    entropy_weight: 0.005
    ppo_target_kl: 0.025
    ppo_value_clip: 10.0
