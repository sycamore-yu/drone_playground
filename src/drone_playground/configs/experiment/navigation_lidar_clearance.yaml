# @package _global_
defaults:
  - override /task: navigation
  - override /scene: S01
  - override /sensor: lidar
  - override /method: policy
initial_checkpoint: ???
simulation:
  method_hz: 10
  num_envs: 64
learning:
  scenes: [S01, S02, S03, D01, D02, D03, S06, D06]
  scene_updates: 20
  options:
    randomize_navigation_start: true
    horizon: 32
    lr: 0.0001
    temporal_gradient_alpha: 0.916290731874155
    altitude_weight: 1.0
    perception_loss:
      clearance_margin: 2.0
      collision_weight: 8.0
      minimum_approach_speed: 1.0
  evaluation_interval: 160
  checkpoint_interval: 40
