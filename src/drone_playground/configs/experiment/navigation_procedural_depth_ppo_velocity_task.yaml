# @package _global_
# Future Task-owned reward experiment. The original *_velocity.yaml stays
# byte-identical to the in-flight Trial-4 configuration for strict resumption.
defaults:
  - navigation_procedural_depth_ppo_velocity
task:
  options:
    reward_profile: legacy_motion_navigation_v2
    reward_shaping:
      task_weight: 1.0
      progress_reward_scale: 0.0
      failure_cost: 0.0
      altitude_weight: 0.0
      height_boundary_weight: 0.0
learning:
  options:
    reward_profile: default
