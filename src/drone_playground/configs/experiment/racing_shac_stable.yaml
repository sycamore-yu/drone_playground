# @package _global_
# Racing SHAC parameters verified by three archived training seeds and
# independent native/LOTF runs in the 2026-10-16 validation study.
defaults:
- racing
simulation:
  num_envs: 256
learning:
  options:
    horizon: 128
    lr: 0.00008125
    critic_lr: 0.0003
    critic_epochs: 2
    target_alpha: 0.95
    progress_reward_scale: 2.0
    failure_cost: 40.0
    bootstrap_weight: 0.2
    report_terminal_critic_grad: false
  max_iterations: 1300
  checkpoint_interval: 50
  best:
    source: evaluation
    interval: 1638400
    episodes: 24
    seed: 1000000
  early_stopping:
    metric: success_rate
    target: 1.0
    patience: 0
    min_delta: 0.0
benchmark:
  episodes: 100
  seed_base: 2000000
  record_replay: true
