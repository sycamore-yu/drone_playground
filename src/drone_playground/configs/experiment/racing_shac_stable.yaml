# @package _global_
# Controlled Racing/SHAC recipe. Retains nonzero terminal-value bootstrap.
# Archived gradient diagnosis: terminal/physical norm ratio 4.69 at full weight.
defaults:
  - racing
simulation:
  num_envs: 256
learning:
  options:
    horizon: 32
    lr: 0.0001
    critic_lr: 0.001
    progress_reward_scale: 1.0
    failure_cost: 50.0
    bootstrap_weight: 0.2
    report_terminal_critic_grad: false
  checkpoint_interval: 50
  evaluation_interval: 100
