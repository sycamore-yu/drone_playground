# @package _global_
# Per-environment motion phase and obstacle layout, same geometry for LiDAR and collision.
defaults:
- navigation_lidar_scratch_safe
- override /scene: train_procedural
initial_checkpoint: null
simulation:
  method_hz: 10
  num_envs: 16
  procedural:
    max_obstacles: 208
    corridor_y: -17.5
    training_seed: ${seed}
learning:
  options:
    randomize_navigation_start: false
