# @package _global_
# Training coefficients from ppo_reference_options_s0/s1/s2, not old policy weights.
defaults:
- racing
initial_checkpoint: null
resume: null
checkpoint: null
task:
  options:
    reward_shaping:
      task_weight: 1.0
      progress_reward_scale: 1.0
      failure_cost: 0.0
simulation:
  num_envs: 512
learning:
  options:
    horizon: 32
    lr: 0.0003
    critic_lr: 0.001
    initial_log_std: -1.5
    entropy_weight: 0.0
    progress_reward_scale: 1.0
    failure_cost: 0.0
    ppo_target_kl: 0.0
    ppo_value_clip: 0.0
  max_iterations: 4096
  checkpoint_interval: 50
  best:
    source: evaluation
    metric: success_rate
    episodes: 100
    confirmation_episodes: 0
    interval: 1638400
    seed: 1000000
  early_stopping:
    metric: success_rate
    target: 1.0
    patience: 0
    min_delta: 0.0
