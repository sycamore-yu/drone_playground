# @package _global_
defaults:
- /env: navigation/static
- /network: none
- override /controller@env.controller: trajectory
- override /dynamics@env.dynamics: crazyflow_so_rpy
- _self_
mode: eval
source: External algorithm service; provenance supplied by its implementation
algorithm:
  name: none
  gradient:
    transition: direct
runtime:
  device: cpu
  backend: host
  action_delay_ms: null
evaluation:
  environment: config
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
  entrypoint: drone_playground.evaluation.run.evaluate_external
method:
  name: external_native
  algorithm: ???
  output: trajectory
  implementation: native_service
  trainable: false
  input_sensor: point_cloud
  workers: 1
  port: 0
  deployment:
    command: null
    address: null
  parameters: {}
  _target_: drone_playground.integrations.grpc_service.build_service_method
