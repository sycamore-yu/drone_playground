# @package _global_
defaults:
- /env: navigation/static
- /network: none
- override /controller@env.controller: trajectory
- override /dynamics@env.dynamics: crazyflow_so_rpy
- _self_
mode: eval
env:
  controller:
    reference_source: trajectory
source: Explicit physical module chain; default minimum-jerk path has no obstacle
  avoidance
algorithm:
  name: none
  gradient:
    transition: direct
runtime:
  device: cpu
  backend: host
  action_delay_ms: null
evaluation:
  environment: config
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
  entrypoint: drone_playground.evaluation.run.evaluate_external
method:
  name: physical_pipeline
  implementation: pipeline
  trainable: false
  output: trajectory
  input_sensor: none
  workers: 1
  port: 0
  stages:
  - _target_: drone_playground.planning.goal.GoalWaypoints
  - _target_: drone_playground.planning.minimum_jerk.MinimumJerkPlanner
    cruise_speed: 2.0
    acceleration_scale: 3.0
    minimum_segment_seconds: 0.5
  _target_: drone_playground.runtime.pipeline.Pipeline
