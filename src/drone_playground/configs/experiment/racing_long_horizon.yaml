# @package _global_
# SHAC baseline collapsed before the first gate; extend differentiation and damp old-state gradients.
defaults:
  - override /task: racing
  - override /scene: racing
  - override /sensor: state
  - override /method: policy
simulation:
  num_envs: 1024
learning:
  options:
    horizon: 64
    lr: 0.0001
    temporal_gradient_alpha: 0.4
  evaluation_interval: 100
  checkpoint_interval: 50
