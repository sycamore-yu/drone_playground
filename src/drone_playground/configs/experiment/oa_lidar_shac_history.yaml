# @package _global_
# Optimizer and task loss coefficients from validated pre-release OA training.
learning:
  loss: liu
  max_iterations: 1000
  options:
    horizon: 32
    lr: 0.0003
    critic_lr: 0.001
    critic_epochs: 4
    gamma: 0.99
    gae_lambda: 0.95
    target_alpha: 0.995
    temporal_gradient_alpha: 0.916290731874155
    initial_log_std: -3.0
    failure_cost: 160.0
    perception_weight: 1.0
    perception_loss:
      clearance_margin: 2.0
      collision_weight: 8.0
      minimum_approach_speed: 1.0
    altitude_weight: 1.0
    randomize_navigation_start: true
    ppo_epochs: 4
    minibatches: 4
    clip_epsilon: 0.2
    entropy_weight: 0.0
    max_grad_norm: 1.0
    weight_decay: 0.0
    task_weight: 1.0
    velocity_aux_weight: 0.0
