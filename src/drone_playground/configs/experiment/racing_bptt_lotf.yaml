# @package _global_
# Settings of a completed 100/100 state-task training run; starts from random weights.
defaults:
- racing
- override /learning: bptt
initial_checkpoint: null
resume: null
simulation:
  navigation_goal_observation: false
  device: gpu
  dynamics: first_principles
  drone: cf21B_500
  physics_hz: 500
  method_hz: 50
  num_envs: 512
  action_delay_s: 0.0
  randomization: {}
  disturbance: {}
method:
  action:
    level: body_rate
    heading: fixed
learning:
  loss: null
  backward_model: lotf
  backward_options: {}
  options:
    horizon: 64
    lr: 0.0003
    critic_lr: 0.001
    gamma: 0.99
    gae_lambda: 0.95
    ppo_epochs: 4
    minibatches: 4
    critic_epochs: 4
    clip_epsilon: 0.2
    entropy_weight: 0.0
    max_grad_norm: 1.0
    target_alpha: 0.995
    temporal_gradient_alpha: 0.0
    initial_log_std: -1.5
    weight_decay: 0.0
    task_weight: 1.0
    perception_weight: 1.0
    velocity_aux_weight: 0.0
    perception_loss: {}
  max_interactions: 32768000
  checkpoint_interval: 100
  log_interval: 10
