# @package _global_
# Independent causal ablation of the older Brax PPO navigation *recipe*.
# The policy emits velocity (m/s) plus yaw, executed through a velocity PID
# inner loop on the same full Crazyflow plant. No old weights are transferred.
defaults:
  - navigation_procedural_depth_ppo
initial_checkpoint: null
simulation:
  num_envs: 64
  navigation_goal_observation: true
  procedural:
    start_sampling: collision_free
method:
  action:
    level: velocity_yaw
    heading: fixed
    low: [-4.0, -4.0, -4.0, -3.141592653589793]
    high: [4.0, 4.0, 4.0, 3.141592653589793]
    velocity_gain: [3.0, 3.0, 5.0]
    acceleration_limit: [6.0, 6.0, 6.0]
    tilt_limit: 0.55
learning:
  loss: null
  scenes: null
  options:
    reward_profile: legacy_motion_navigation_v2
    perception_loss: null
    perception_weight: 0.0
    progress_reward_scale: 0.0
    failure_cost: 0.0
    height_boundary_weight: 0.0
    horizon: 32
    minibatches: 8
    ppo_epochs: 4
    critic_epochs: 4
    lr: 0.0005
    critic_lr: 0.001
    gamma: 0.995
    gae_lambda: 0.95
    clip_epsilon: 0.1
    entropy_weight: 0.001
    initial_log_std: -1.5
    ppo_target_kl: 0.02
    ppo_value_clip: 1.0
