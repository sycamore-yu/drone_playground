# @package _global_
defaults:
- /env: tracking
- /network: mlp_32
- /algorithm: bptt
- _self_
source: BPTT with the Brax APG policy and finite-horizon mean-reward gradient; explicit
  snapshots and continuation
training:
  num_envs: 16
  num_timesteps: null
runtime:
  action_delay_ms:
  - 25.0
  - 50.0
evaluation:
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
method:
  name: policy
  output: ${env.controller.input_kind}
  implementation: neural
  trainable: true
