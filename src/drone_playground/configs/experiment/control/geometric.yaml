# @package _global_
defaults:
- /env: tracking
- /network: mlp_32
- /algorithm: bptt
- override /controller@env.controller: trajectory
- _self_
source: JAX neural geometric output with explicit PD lookahead; component training,
  not a paper baseline
training:
  num_envs: 16
  num_timesteps: null
runtime:
  action_delay_ms:
  - 25.0
  - 50.0
evaluation:
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
env:
  task: {}
  controller:
    _target_: drone_playground.control.controllers.trajectory_jax.JaxTrajectoryTracking
    lead_seconds: 0.1
method:
  name: policy
  output: trajectory
  implementation: neural
  trainable: true
  goal_source: observation_reference
  physical_decoder:
    kind: trajectory
    anchor: goal
    count: 1
    position_scale_m:
    - 1.0
    - 1.0
    - 1.0
    velocity_scale_mps:
    - 1.0
    - 1.0
    - 1.0
    acceleration_scale_mps2:
    - 1.0
    - 1.0
    - 1.0
    horizon_seconds: 1.0
    tolerance_m: 0.2
