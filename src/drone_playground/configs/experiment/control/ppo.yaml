# @package _global_
defaults:
- /env: tracking
- /network: gaussian_mlp_64
- /algorithm: ppo
- _self_
source: Crazyflow paper PPO-scale recipe + Brax native trainer; task is public FigureEight,
  not the paper Lissajous task
runtime:
  action_delay_ms:
  - 25.0
  - 50.0
evaluation:
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
method:
  name: policy
  output: ${env.controller.input_kind}
  implementation: neural
  trainable: true
