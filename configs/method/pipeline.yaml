# @package _global_
defaults:
- /env: navigation/static
- /algorithm: none
- /network: none
- /training: default
- /runtime: host
- /evaluation: default
- /visualization: rscope
- override /execution@env.execution: trajectory_tracking
- _self_
method:
  name: physical_pipeline
  implementation: pipeline
  trainable: false
  output: trajectory
  input_sensor: point_cloud
  workers: 1
  port: 0
  stages:
  - implementation: goal
  - implementation: minimum_jerk
    parameters:
      cruise_speed: 2.0
      acceleration_scale: 3.0
      minimum_segment_seconds: 0.5
source: Explicit physical module chain; default minimum-jerk path has no obstacle avoidance
mode: eval
evaluation:
  environment: config
