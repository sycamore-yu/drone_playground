# @package _global_
defaults:
- /method/learning/bptt
- override /execution@env.execution: trajectory_tracking
- override /controller@env.execution.tracker: jax_trajectory_tracking
- _self_
method:
  name: geometric_policy
  output: trajectory
  goal_source: observation_reference
  physical_decoder:
    kind: trajectory
    anchor: goal
    count: 1
    position_scale_m: [1.0, 1.0, 1.0]
    velocity_scale_mps: [1.0, 1.0, 1.0]
    acceleration_scale_mps2: [1.0, 1.0, 1.0]
    horizon_seconds: 1.0
    tolerance_m: 0.2
source: JAX neural geometric output with explicit PD lookahead; component training, not a paper baseline
