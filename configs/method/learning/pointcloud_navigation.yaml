# @package _global_
defaults:
- /env: navigation/pointcloud_mixed
- /algorithm: pointcloud_navigation_bptt
- /network: paper_pointnet_gru
- /training: default
- /runtime: jax
- /evaluation: default
- /visualization: rscope
- _self_
method:
  name: pointcloud_navigation_adaptation
  output: world_acceleration
  network_output_frame: body
  command_units: m/s^2
  implementation: pointcloud_recurrent
  trainable: true
source: PointNet/GRU architecture of Learning to Fly from Point Clouds; explicitly trained navigation-domain adaptation, not zero-shot reproduction
mode: train
runtime:
  action_delay_ms: [25.0, 50.0]
training:
  num_envs: 8
  num_timesteps: null
  policy_updates: 512
  num_evals: 5
  development_episodes: 1
  max_wall_seconds: 900
evaluation:
  episodes: 4
  commanded_speed: 4.0
  protocol: benchmarks/navigation/v2/protocol.yaml
  recipe_identity: pointcloud-navigation-adaptation-v1
