# @package _global_
defaults:
- /env: navigation/static_velocity
- /algorithm: ppo
- /network: perception_navigation_velocity
- /training: navigation_convergence
- /runtime: jax
- /evaluation: navigation_v2
- /visualization: rscope
- _self_
method:
  name: ppo_velocity_navigation
  output: velocity_yaw
  implementation: neural
  trainable: true
source: PPO with explicit velocity tracking inner loop, inspired by NavRL action decomposition; no dynamic-object oracle or safety shield
mode: train
runtime:
  action_delay_ms: [25.0, 50.0]
training:
  num_envs: 128
  num_timesteps: 2097152
algorithm:
  learning_rate: 0.0005
  discounting: 0.995
  clipping_epsilon: 0.1
  entropy_cost: 0.001
  unroll_length: 32
  batch_size: 128
  num_minibatches: 8
  num_updates_per_batch: 4
objective:
  reward_scale: 0.01
