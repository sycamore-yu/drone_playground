# @package _global_
defaults:
- /env: navigation/static_velocity
- /algorithm: shac
- /network: perception_navigation_velocity
- /training: navigation_convergence
- /runtime: jax
- /evaluation: navigation_v2
- /visualization: rscope
- _self_
method:
  name: shac_velocity_navigation
  output: velocity_yaw
  implementation: neural
  trainable: true
source: SHAC with explicit velocity tracking inner loop; same full Crazyflow plant and navigation scenes
mode: train
runtime:
  action_delay_ms: [25.0, 50.0]
algorithm:
  learning_rate: 0.0003
  critic_learning_rate: 0.0003
  horizon_length: 64
  target_critic_alpha: 0.995
  discounting: 0.995
  use_schedule: false
objective:
  reward_scale: 0.01
