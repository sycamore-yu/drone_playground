# @package _global_
defaults:
- /env: navigation/static
- /algorithm: none
- /network: none
- /training: default
- /runtime: host
- /evaluation: default
- /visualization: rscope
- override /sensor@env.sensor: mid360
- override /observation@env.observation: navigation_lidar
- override /execution@env.execution: trajectory_tracking
- _self_
method:
  name: super
  method: super
  output: trajectory
  container: drone-playground-ros1
  port: 11325
  workers: 4
  implementation: native_super
  trainable: false
source: Native super through ROS1; shared P5 geometry and dynamics
mode: eval
evaluation:
  environment: config
