# @package _global_
defaults:
- /env: navigation/static
- /algorithm: none
- /network: none
- /training: default
- /runtime: host
- /evaluation: default
- /visualization: rscope
- override /sensor@env.sensor: d435
- override /observation@env.observation: navigation_depth
- override /execution@env.execution: trajectory_tracking
- _self_
method:
  name: ego_planner
  method: ego
  output: trajectory
  container: drone-playground-ros1
  port: 11325
  workers: 4
  implementation: native_ego
  trainable: false
source: Native ego through ROS1; shared P5 geometry and dynamics
mode: eval
evaluation:
  environment: config
