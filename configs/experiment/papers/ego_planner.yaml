# @package _global_
defaults:
- /env: navigation/static
- /network: none
- override /sensor@env.sensor: d435
- override /action@env.action: trajectory_tracking
- override /dynamics@env.dynamics: crazyflow_so_rpy
- _self_
mode: eval
source: Native ego through ROS1; shared P5 geometry and dynamics
algorithm:
  name: none
  gradient:
    transition: direct
runtime:
  device: cpu
  backend: host
  action_delay_ms: null
evaluation:
  environment: config
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
env:
  observation:
    name: navigation_depth
    points_per_frame: 300
    channels: 2
    far_m: 10.0
method:
  name: ego_planner
  method: ego
  output: trajectory
  container: drone-playground-ros1
  port: 11325
  workers: 4
  implementation: native_ego
  trainable: false
  limits:
    max_velocity_mps: 20.0
    max_acceleration_mps2: 3.0
    planning_horizon_m: 7.5
experiment:
  name: ego_planner
  kind: paper
  paper: 'EGO-Planner: An ESDF-free Gradient-based Local Planner for Quadrotors'
  fidelity: native_upstream
