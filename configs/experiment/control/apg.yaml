# @package _global_
defaults:
- /env: tracking
- /network: mlp_32
- /algorithm: apg
- _self_
source: Brax native APG with Crazyflow paper-style 16 worlds/40 step rollout; custom
  frozen checkpoint_eval recipe
training:
  num_envs: 16
  num_timesteps: null
evaluation:
  acceptance:
    completion_rate: 0.9
    tracking_rmse_m: 0.25
    navigation_success_rate: 0.9
    navigation_scene_success_rate: 0.8
  record_planner_visualization: true
method:
  name: apg
  output: ${env.action.command}
  implementation: neural
  trainable: true
