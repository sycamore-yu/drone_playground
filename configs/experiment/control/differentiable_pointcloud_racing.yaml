# @package _global_
defaults:
- /sensor@env.sensor: uniform_lidar
- /action@env.action: acceleration
- /dynamics@env.dynamics: point_mass_lag
- /network: pointnet_gru
- _self_
env:
  scene:
    _target_: drone_playground.environments.scenes.racing.RacingScene
    name: lsy_level0
  task:
    name: racing
    freq: 10
    duration: 30.0
    reference: lsy_course
    reference_count: 256
    numerical_guard: false
    reference_generator:
      _target_: drone_playground.environments.tasks.references.ReferenceGenerator
      name: lsy_course
      amplitude: 1.0
    time_limit_kind: termination
    policy_evaluator: drone_playground.evaluation.racing.RaceEvaluator
    command_distribution:
      kind: reference
      distribution: reference_bank
    adapter: recurrent_reference
    adapter_identity: pointcloud-platform-control-v1
    physics_freq: 500
    body_radius: 0.07
    goal_radius: 0.5
    reference_gain: 2.0
    velocity_limit: 20.0
    integration: 500Hz-held-command-substeps
    floor_rule: centre-z-below-zero; canonical takeoff contact convention
    _target_: drone_playground.environments.tasks.tracking.acceleration.AccelerationTrackingEnv
    evaluation_entrypoint: drone_playground.evaluation.tracking.acceleration.evaluate_pointcloud_control
    trainer: drone_playground.learning.algorithms.recurrent_tracking_bptt.train
  observation:
    _target_: drone_playground.environments.observations.flight_state.FlightStateObservation
    name: flight_state
    proprioception_size: 10
  name: racing
objective:
  name: reference_tracking
  identity: canonical-reference-trajectory-loss-v1
  position_loss: 1.0
  velocity_loss: 0.1
  acceleration_loss: 0.0001
  jerk_loss: 1.0e-06
  collision_loss: 2.0
  collision_margin_m: 0.05
runtime:
  action_delay_ms:
  - 25.0
  - 50.0
reproduction:
  task_adapter: pointcloud-canonical-control-transfer-v1
  task_scope: Control transfer, not the original paper navigation benchmark; uses its encoder and GRU
    with canonical task references and a separately named trajectory objective.
  identity: paper-public-information-reconstruction-v1
  paper: Learning to Fly from Point Clouds via Differentiable Simulation
  source_url: https://rasevents.org/uploads/documents/pdfviewer/a9/f4/233762-1123.pdf
  predecessor: HenryHuYu/DiffPhysDrone@271936190b5c2a5e760230e718fa6b167718a5bf
  author_code_status: no confirmed repository found in exact-title searches on 2026-09-28
  assumptions_document: notes/research/pointcloud.md
  assumptions:
  - The paper specifies point mass and lag; lag constant and trapezoidal integration follow the predecessor.
  - Eq9 whole-state exponential Jacobian is distinct from the predecessor partial-diagonal CUDA rule.
  - Sensor state gradients are detached; the paper does not specify a differentiable ray-casting implementation.
  - Ten proprioceptive fields, elevation offset, range limits, activation slope, and invalid-ray masking
    are explicit reconstruction choices.
  - Undisclosed loss weights, jerk averaging, optimizer defaults, primitive distribution, and speed distribution
    are explicitly configured.
  - 50000 updates follows the training figure extent and predecessor default, not a text-specified update
    budget.
  - Navigation8 uses its 0.07m body radius, task boundaries, and terminal rules; the policy is trained
    only on independent static primitives.
training:
  reset_randomization:
    position_std_m: 0.1
    velocity_std_mps: 0.2
    scene_phase_s:
    - 0.0
    - 30.0
  num_envs: 32
  policy_updates: 50000
  num_timesteps: null
  num_evals: 11
  max_wall_seconds: 172800
  checkpoint_eval_envs: 32
  stop_after_updates: null
evaluation:
  initial_conditions:
    position_std_m: 0.02
  environment: config
  episodes: 1
  training_run: null
  speeds:
  - 4.0
  - 6.0
  - 8.0
  scene_ids:
  - S01
  - S02
  - S03
  - S06
  - D01
  - D02
  - D03
  - D06
  duration: 40.0
source: Learning to Fly from Point Clouds via Differentiable Simulation; public-paper reconstruction
algorithm:
  name: recurrent_bptt
  horizon_length: 160
  learning_rate: 0.0001
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight_decay: 0.01
  gradient:
    transition: exponential
    decay_rate: 0.916290731874155
  trainer: drone_playground.learning.algorithms.recurrent_bptt.train
method:
  name: differentiable_pointcloud
  output: world_acceleration
  network_output_frame: body
  command_units: m/s^2
  implementation: pointcloud_recurrent
  trainable: true
experiment:
  name: differentiable_pointcloud
  kind: paper
  paper: Learning to Fly from Point Clouds via Differentiable Simulation
  fidelity: public_information_reconstruction
