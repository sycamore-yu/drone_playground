# @package _global_
defaults:
- override /algorithm: apg
- override /network: brax_apg
- override /task: figure8
- override /scene: empty
dynamics:
  forward: so_rpy
  drone: cf2x_L250
algorithm:
  horizon_length: 40
  learning_rate: 0.005
  max_grad_norm: 1.0
  use_schedule: true
  schedule_decay: 0.997
network:
  normalize_observations: false
  hidden_sizes:
  - 32
  - 32
  layer_norm: true
training:
  seed: 0
  policy_updates: 1024
  num_envs: 16
  num_evals: 9
  publish_live: false
  max_wall_seconds: 3600
task:
  freq: 50
source: Brax native APG with Crazyflow paper-style 16 worlds/40 step rollout; custom
  frozen development recipe
