# @package _global_
defaults:
- override /algorithm: ppo
- override /network: brax_ppo
- override /task: navigation_dynamic
- override /scene: navigation_dynamic
- override /observation: navigation_state
- override /objective: navigation
- override /policy: neural_navigation
dynamics:
  forward: first_principles
  backward: direct
  drone: cf2x_L250
algorithm:
  unroll_length: 16
  batch_size: 32
  num_minibatches: 8
  num_updates_per_batch: 4
  learning_rate: 0.0008
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  entropy_cost: 0.005
  max_grad_norm: 1.0
network:
  distribution_type: normal
  normalize_observations: true
  hidden_sizes:
  - 64
  - 64
  init_noise_std: 0.367879
training:
  seed: 0
  num_timesteps: 262144
  num_envs: 128
  num_evals: 3
  publish_live: false
  max_wall_seconds: 1800
source: P5 navigation engineering closed loop; state observation, shared navigation reward
