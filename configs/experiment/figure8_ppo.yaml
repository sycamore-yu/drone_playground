# @package _global_
defaults:
- override /algorithm: ppo
- override /network: brax_ppo
- override /task: figure8
- override /scene: empty
dynamics:
  forward: so_rpy
  drone: cf2x_L250
algorithm:
  unroll_length: 16
  batch_size: 64
  num_minibatches: 16
  num_updates_per_batch: 8
  learning_rate: 0.0008
  discounting: 0.92
  gae_lambda: 0.94
  clipping_epsilon: 0.2
  entropy_cost: 0.007
  max_grad_norm: 1.0
network:
  distribution_type: normal
  normalize_observations: false
  hidden_sizes:
  - 64
  - 64
  init_noise_std: 0.367879
training:
  seed: 0
  num_timesteps: 2097152
  num_envs: 1024
  num_evals: 9
  publish_live: false
  max_wall_seconds: 3600
task:
  freq: 50
source: Crazyflow paper PPO-scale recipe + Brax native trainer; task is public FigureEight,
  not the paper Lissajous task
