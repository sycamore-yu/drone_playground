# @package _global_
defaults:
- override /algorithm: ppo
- override /network: brax_ppo
- override /task: random
- override /scene: empty
dynamics:
  forward: so_rpy_rotor_drag
  drone: cf21B_500
algorithm:
  unroll_length: 16
  batch_size: 64
  num_minibatches: 16
  num_updates_per_batch: 8
  learning_rate: 0.0008
  discounting: 0.94
  gae_lambda: 0.97
  clipping_epsilon: 0.26
  entropy_cost: 0.007
  max_grad_norm: 1.5
network:
  distribution_type: normal
  normalize_observations: false
  hidden_sizes:
  - 64
  - 64
  init_noise_std: 0.367879
training:
  seed: 0
  num_timesteps: 4194304
  num_envs: 1024
  num_evals: 9
  publish_live: false
  max_wall_seconds: 3600
task:
  freq: 50
  reference_count: 256
  numerical_guard: true
source: P3 v3 restores original PPO recipe; explicit finite-square-v1 numerical failure
  boundary after captured angular rate 8.119e26 overflowed normalizer and critic.
  Ordinary physical transitions unchanged; invalid integration ends and counts as
  a failure. v1/v2 preserved.
