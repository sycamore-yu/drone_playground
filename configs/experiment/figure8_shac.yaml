# @package _global_
defaults:
- override /algorithm: shac
- override /network: brax_shac
- override /task: figure8
- override /scene: empty
dynamics:
  forward: so_rpy
  drone: cf2x_L250
algorithm:
  horizon_length: 32
  learning_rate: 0.003
  critic_learning_rate: 0.002
  critic_updates: 8
  discounting: 0.99
  td_lambda: 0.95
  target_critic_alpha: 0.4
  max_grad_norm: 1.0
  critic_max_grad_norm: 10.0
  use_schedule: true
  schedule_decay: 0.997
network:
  normalize_observations: false
  hidden_sizes:
  - 64
  - 64
  layer_norm: true
training:
  seed: 0
  policy_updates: 320
  num_envs: 64
  num_evals: 9
  publish_live: false
  max_wall_seconds: 3600
task:
  freq: 50
  reference_count: 256
source: Independent SHAC JAX implementation based on Xu et al. 2022; Brax APG policy
  network; unchanged P2 task
