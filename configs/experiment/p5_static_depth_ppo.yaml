# @package _global_
# P5 formal unit 1: static navigation, D435 depth, PPO.
# Engineering runs override training.num_timesteps down; the recipe itself
# declares the frozen formal budget of 8,388,608 interactions.
defaults:
- override /algorithm: ppo
- override /network: brax_ppo
- override /task: navigation_static
- override /scene: navigation_static
- override /observation: navigation_depth
- override /objective: navigation
- override /policy: neural_navigation
dynamics:
  forward: first_principles
  backward: direct
  drone: cf2x_L250
algorithm:
  unroll_length: 16
  batch_size: 64
  num_minibatches: 16
  num_updates_per_batch: 8
  learning_rate: 0.0008
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  entropy_cost: 0.005
  max_grad_norm: 1.0
network:
  distribution_type: normal
  normalize_observations: true
  hidden_sizes:
  - 128
  - 128
  init_noise_std: 0.367879
training:
  seed: 0
  num_timesteps: 8388608
  num_envs: 128
  num_evals: 9
  publish_live: false
  max_wall_seconds: 7200
source: P5 formal matrix unit 1; D435 ideal metric depth, shared navigation reward
