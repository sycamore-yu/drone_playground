<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101827" />
  <link rel="icon" href="data:," />
  <title>Drone Playground | Interactive MuJoCo Replay</title>
  <style>
    :root{color-scheme:dark;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:#101827;color:#e5eef8}
    *{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100dvh}
    header{padding:12px 18px;background:#18243a;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;z-index:1}
    h1{font-weight:600;font-size:16px;margin:0}p{margin:0;color:#a7bdd8}
    .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .playback-main,.view-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
    .playback-main{flex:1 1 300px}
    .view-actions{flex:0 1 auto}
    input,select,button{background:#101d31;color:#e5eef8;border:1px solid #455875;border-radius:6px;padding:7px 10px}
    input[type=url]{flex:1;min-width:200px}input[type=range]{flex:1;min-width:140px}
    button{cursor:pointer}button:hover{border-color:#91c5f7}
    :focus-visible{outline:2px solid #95dded;outline-offset:2px}
    #scene{width:100%;height:100%;min-height:100px;overflow:hidden;flex:1;position:relative}
    #scene canvas{display:block;width:100%;height:100%}
    #end-banner{position:absolute;bottom:14px;left:14px;right:14px;width:max-content;max-width:calc(100% - 28px);padding:10px 13px;border:1px solid #dfac86;background:rgba(45,27,22,.92);color:#fff0e4;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:none;overflow-wrap:anywhere;z-index:2}
    #end-banner[hidden]{display:none}
    #status{font-variant-numeric:tabular-nums;font-size:13px}
    .disabled{opacity:.45}footer{padding:9px 18px;background:#18243a;color:#adc1dc;display:flex;gap:16px;justify-content:space-between}
    a{color:#a3d5fa}
    body.embedded header{padding:8px 12px;gap:5px}body.embedded header h1,body.embedded header .controls:first-of-type,body.embedded footer{display:none}
    body.embedded .controls{gap:7px}body.embedded .controls button,body.embedded .controls select{padding:5px 7px;font-size:12px}
    body.embedded #time{font-size:12px}body.embedded #scene{min-height:100px}
    body.embedded .playback-toolbar{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0;width:100%}
    body.embedded .playback-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;flex:none;min-width:0;width:100%}
    body.embedded .playback-main #timeline{min-width:0;width:100%}
    body.embedded .view-actions{display:flex;flex:none;flex-wrap:nowrap;gap:6px;min-width:0;width:100%;max-width:100%;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:#59738c transparent}
    body.embedded .view-actions>*{flex:0 0 auto;white-space:nowrap}
    @media(max-width:440px){body.embedded header{padding:7px 9px}body.embedded .playback-main{gap:5px}body.embedded #time{font-size:11px}}
  </style>
</head>
<body>
  <header>
    <h1>Drone Playground · Interactive MuJoCo Replay</h1>
    <div class="controls">
      <input id="record" type="url" aria-label="Browser replay URL" placeholder="/results/.../replays/racing-0000/browser_replay.json" />
      <button id="load" type="button">Load recording</button>
      <span id="status" role="status">Ready</span>
    </div>
    <div class="controls playback-toolbar">
      <div class="playback-main">
        <button id="play" type="button" disabled>Play</button>
        <input id="timeline" type="range" min="0" max="0" step="1" value="0" disabled aria-label="Recorded flight time" />
        <span id="time">0.000 s</span>
      </div>
      <div class="view-actions" role="group" aria-label="Playback and camera options">
        <label for="speed">Speed</label>
        <select id="speed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        <button id="view" type="button">Camera: Aircraft</button>
        <button id="follow" type="button">Follow drone: On</button>
        <button id="trail" type="button">Flight path: On</button>
        <button id="hits" type="button">Sensor hits: On</button>
        <button id="obstacles" type="button" title="Show native obstacles transparently for inspection; recorded geometry and collisions are unchanged">Obstacles: Solid</button>
      </div>
    </div>
  </header>
  <main id="scene" aria-label="3D MuJoCo recorded flight"><div id="end-banner" hidden role="status"></div></main>
  <footer><span>Rotate: drag · Pan: right-drag · Zoom: wheel</span><span>Recorded qpos + mocap · No physics resimulation</span><a href="https://github.com/google-deepmind/mujoco/tree/main/wasm">MuJoCo WASM</a></footer>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
